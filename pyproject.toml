[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "comfyui-yue2-humcomposer"
version = "0.1.0"
description = "Independent symbolic melody anchors for native ComfyUI YuE2 workflows"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[tool.setuptools.packages.find]
include = ["humcomposer*", "nodes*"]

[tool.setuptools.package-data]
humcomposer = ["locales/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra --confcutdir=tests -p no:cacheprovider"
